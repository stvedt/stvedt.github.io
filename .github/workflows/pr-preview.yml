# Comments a browser preview link on each pull request.
# raw.githack.com serves the PR branch's files straight from GitHub, so no build or deploy is needed.
name: PR preview link

on:
  # pull_request_target so fork PRs can be commented on too; this job never checks out PR code.
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const url = `https://raw.githack.com/${pr.head.repo.full_name}/${encodeURI(pr.head.ref)}/index.html`;
            const marker = '<!-- pr-preview-link -->';
            const body = [
              marker,
              `**Preview:** ${url}`,
              '',
              '_Serves this branch\'s files straight from GitHub. New pushes show up after a few minutes of caching._',
            ].join('\n');

            // Update the existing preview comment rather than posting a new one on reopen.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }
